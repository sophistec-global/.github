<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img"><title>Agentic Execution Loop</title><desc>Controlled AI agent workflow.</desc><style>
text{font-family:Arial,sans-serif}.bg{fill:#F8FAFC}.title{font-size:22px;font-weight:700;fill:#0F172A}.label{font-size:14px;font-weight:700;fill:#1E293B}.small{font-size:11px;fill:#64748B}
.blue{fill:#EAF2FF;stroke:#0B5FFF;stroke-width:2}.teal{fill:#E8FBF7;stroke:#00A99D;stroke-width:2}.violet{fill:#F3EEFF;stroke:#6D28D9;stroke-width:2}.navy{fill:#EEF2F7;stroke:#1D3557;stroke-width:2}.panel{fill:#fff;stroke:#D8E1EE;stroke-width:1.5}
.line{stroke:#CBD5E1;stroke-width:2;fill:none}.dash{stroke:#94A3B8;stroke-width:2;fill:none;stroke-dasharray:7 7}.db{fill:#0B5FFF}.dt{fill:#00A99D}.dv{fill:#6D28D9}
@media(prefers-color-scheme:dark){.bg{fill:#0B1120}.title,.label{fill:#F8FAFC}.small{fill:#94A3B8}.blue,.teal,.violet,.navy,.panel{fill:#111827}.line,.dash{stroke:#475569}}
/* node-impact-effect */.motion-layer{filter:drop-shadow(0 0 7px #00A99D);opacity:.95}rect:not(.bg){fill-opacity:.96}@media(prefers-reduced-motion:reduce){.motion-layer{display:none}}</style><rect width="1200" height="420" rx="24" class="bg"/><text x="600" y="34" text-anchor="middle" class="title">Agentic Execution Loop</text><g class="motion-layer" pointer-events="none"><circle r="7" class="dv"><animateMotion dur="5s" repeatCount="indefinite"><mpath href="#loop"/></animateMotion></circle></g><rect x="480" y="70" width="240" height="65" rx="15" class="blue"><animate data-ball-impact="true" attributeName="fill" values="#EAF2FF;#93C5FD;#EAF2FF;#EAF2FF" keyTimes="0;.07;.16;1" dur="5s" begin="4.83s" repeatCount="indefinite"/></rect><text x="600.0" y="99" text-anchor="middle" class="label">GOAL / INTENT</text><text x="600.0" y="120" text-anchor="middle" class="small">User or System Request</text><rect x="110" y="185" width="200" height="65" rx="15" class="violet"><animate data-ball-impact="true" attributeName="fill" values="#F3EEFF;#C4B5FD;#F3EEFF;#F3EEFF" keyTimes="0;.07;.16;1" dur="5s" begin="0.00s" repeatCount="indefinite"/></rect><text x="210.0" y="214" text-anchor="middle" class="label">Plan</text><text x="210.0" y="235" text-anchor="middle" class="small">Reason · Route</text><rect x="360" y="185" width="200" height="65" rx="15" class="blue"/><text x="460.0" y="214" text-anchor="middle" class="label">Retrieve</text><text x="460.0" y="235" text-anchor="middle" class="small">RAG · Memory</text><rect x="610" y="185" width="200" height="65" rx="15" class="teal"/><text x="710.0" y="214" text-anchor="middle" class="label">Use Tools</text><text x="710.0" y="235" text-anchor="middle" class="small">MCP · APIs</text><rect x="860" y="185" width="200" height="65" rx="15" class="navy"><animate data-ball-impact="true" attributeName="fill" values="#EEF2F7;#93C5FD;#EEF2F7;#EEF2F7" keyTimes="0;.07;.16;1" dur="5s" begin="2.50s" repeatCount="indefinite"/></rect><text x="960.0" y="214" text-anchor="middle" class="label">Validate</text><text x="960.0" y="235" text-anchor="middle" class="small">Policy · Schema</text><path d="M600 135 V165 M210 165 H960 M210 165 V185 M460 165 V185 M710 165 V185 M960 165 V185" class="line"/><rect x="480" y="305" width="240" height="65" rx="15" class="teal"/><text x="600.0" y="334" text-anchor="middle" class="label">ACTION / RESPONSE</text><text x="600.0" y="355" text-anchor="middle" class="small">Auditable · Controlled</text><path id="loop" d="M210 250 C210 290 960 290 960 250 C1080 250 1080 90 600 102" class="dash"/></svg>