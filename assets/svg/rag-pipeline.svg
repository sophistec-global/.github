<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">Enterprise RAG Pipeline</title><desc id="desc">Documents, structured data, and knowledge flow through processing, chunking and metadata, embeddings, vector storage, semantic or hybrid retrieval, re-ranking and context, an LLM or agent, and a grounded response or action.</desc>
<defs><filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity=".09"/></filter><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#94A3B8"/></marker></defs>
<style>text{font-family:Arial,sans-serif}.bg{fill:#F8FAFC}.title{font-size:24px;font-weight:700;fill:#0F172A}.label{font-size:12px;font-weight:700;fill:#1E293B}.small{font-size:10px;fill:#64748B}.card{fill:#fff;stroke-width:1.7}.b{stroke:#0B5FFF}.t{stroke:#00A99D}.v{stroke:#6D28D9}.n{stroke:#1D3557}.line{fill:none;stroke:#94A3B8;stroke-width:2;marker-end:url(#a)}.pulse{fill:#00A99D}@media(prefers-color-scheme:dark){.bg{fill:#0B1120}.title,.label{fill:#F8FAFC}.small{fill:#94A3B8}.card{fill:#111827}.line{stroke:#64748B}}/* node-impact-effect */.motion-layer{filter:drop-shadow(0 0 7px #00A99D);opacity:.95}rect:not(.bg){fill-opacity:.96}@media(prefers-reduced-motion:reduce){.motion-layer{display:none}}</style>
<rect width="1200" height="430" rx="24" class="bg"/><text x="600" y="38" text-anchor="middle" class="title">Enterprise RAG Pipeline</text><text x="600" y="60" text-anchor="middle" class="small">Private knowledge → trusted retrieval → grounded generation</text>
<!-- Boundary-to-boundary connectors, rendered behind every card. -->
<path d="M140 151H165M285 151H310M430 151H455M575 151H600M720 151H745M865 151H890M1010 151H1035M1095 186V238" class="line"/>
<g class="motion-layer" pointer-events="none"><circle r="6" class="pulse"><animateMotion dur="6s" repeatCount="indefinite" path="M80 151H1095V273"/></circle></g>
<g filter="url(#s)">
<g transform="translate(20 116)"><rect width="120" height="70" rx="14" class="card b"><animate data-ball-impact="true" attributeName="fill" values="#fff;#DBEAFE;#fff;#fff" keyTimes="0;.07;.16;1" dur="6s" begin="0s" repeatCount="indefinite"/></rect><text x="60" y="29" text-anchor="middle" class="label">Knowledge</text><text x="60" y="48" text-anchor="middle" class="small">Docs · data · sources</text></g>
<g transform="translate(165 116)"><rect width="120" height="70" rx="14" class="card t"><animate data-ball-impact="true" attributeName="fill" values="#fff;#CCFBF1;#fff;#fff" keyTimes="0;.07;.16;1" dur="6s" begin=".77s" repeatCount="indefinite"/></rect><text x="60" y="29" text-anchor="middle" class="label">Data Processing</text><text x="60" y="48" text-anchor="middle" class="small">Parse · clean</text></g>
<g transform="translate(310 116)"><rect width="120" height="70" rx="14" class="card v"><animate data-ball-impact="true" attributeName="fill" values="#fff;#EDE9FE;#fff;#fff" keyTimes="0;.07;.16;1" dur="6s" begin="1.53s" repeatCount="indefinite"/></rect><text x="60" y="29" text-anchor="middle" class="label">Chunking</text><text x="60" y="48" text-anchor="middle" class="small">Metadata</text></g>
<g transform="translate(455 116)"><rect width="120" height="70" rx="14" class="card n"><animate data-ball-impact="true" attributeName="fill" values="#fff;#DBEAFE;#fff;#fff" keyTimes="0;.07;.16;1" dur="6s" begin="2.30s" repeatCount="indefinite"/></rect><text x="60" y="29" text-anchor="middle" class="label">Embeddings</text><text x="60" y="48" text-anchor="middle" class="small">Vectorize</text></g>
<g transform="translate(600 116)"><rect width="120" height="70" rx="14" class="card b"><animate data-ball-impact="true" attributeName="fill" values="#fff;#DBEAFE;#fff;#fff" keyTimes="0;.07;.16;1" dur="6s" begin="3.06s" repeatCount="indefinite"/></rect><text x="60" y="29" text-anchor="middle" class="label">Vector Storage</text><text x="60" y="48" text-anchor="middle" class="small">Index · persist</text></g>
<g transform="translate(745 116)"><rect width="120" height="70" rx="14" class="card t"><animate data-ball-impact="true" attributeName="fill" values="#fff;#CCFBF1;#fff;#fff" keyTimes="0;.07;.16;1" dur="6s" begin="3.83s" repeatCount="indefinite"/></rect><text x="60" y="29" text-anchor="middle" class="label">Retrieval</text><text x="60" y="48" text-anchor="middle" class="small">Semantic · hybrid</text></g>
<g transform="translate(890 116)"><rect width="120" height="70" rx="14" class="card v"><animate data-ball-impact="true" attributeName="fill" values="#fff;#EDE9FE;#fff;#fff" keyTimes="0;.07;.16;1" dur="6s" begin="4.59s" repeatCount="indefinite"/></rect><text x="60" y="29" text-anchor="middle" class="label">Re-Ranking</text><text x="60" y="48" text-anchor="middle" class="small">Context</text></g>
<g transform="translate(1035 116)"><rect width="120" height="70" rx="14" class="card n"><animate data-ball-impact="true" attributeName="fill" values="#fff;#DBEAFE;#fff;#fff" keyTimes="0;.07;.16;1" dur="6s" begin="5.36s" repeatCount="indefinite"/></rect><text x="60" y="29" text-anchor="middle" class="label">LLM / Agent</text><text x="60" y="48" text-anchor="middle" class="small">Reason · generate</text></g>
<g transform="translate(1035 238)"><rect width="120" height="70" rx="14" class="card t"><animate data-ball-impact="true" attributeName="fill" values="#fff;#CCFBF1;#fff;#fff" keyTimes="0;.07;.16;1" dur="6s" begin="5.86s" repeatCount="indefinite"/></rect><text x="60" y="29" text-anchor="middle" class="label">Grounded</text><text x="60" y="48" text-anchor="middle" class="small">Response / action</text></g>
</g><text x="600" y="372" text-anchor="middle" class="small">Grounded context · traceable sources · permission-aware action</text>
</svg>
