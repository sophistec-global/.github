</style><rect class="bg" width="1200" height="270" rx="24"/><text x="600" y="34" text-anchor="middle" class="h">Release &amp; Support Lifecycle</text><path d="M70 140 H1130" class="line"/><rect x="12" y="105" width="116" height="70" rx="14" class="b"/><text x="70" y="135" text-anchor="middle" class="l">Develop</text><text x="70" y="156" text-anchor="middle" class="s">Change</text><rect x="189" y="105" width="116" height="70" rx="14" class="t"/><text x="247" y="135" text-anchor="middle" class="l">Test</text><text x="247" y="156" text-anchor="middle" class="s">Validate</text><rect x="365" y="105" width="116" height="70" rx="14" class="v"/><text x="423" y="135" text-anchor="middle" class="l">Preview</text><text x="423" y="156" text-anchor="middle" class="s">Early</text><rect x="542" y="105" width="116" height="70" rx="14" class="n"/><text x="600" y="135" text-anchor="middle" class="l">Release</text><text x="600" y="156" text-anchor="middle" class="s">GA</text><rect x="719" y="105" width="116" height="70" rx="14" class="b"/><text x="777" y="135" text-anchor="middle" class="l">Observe</text><text x="777" y="156" text-anchor="middle" class="s">Operate</text><rect x="895" y="105" width="116" height="70" rx="14" class="t"/><text x="953" y="135" text-anchor="middle" class="l">Patch</text><text x="953" y="156" text-anchor="middle" class="s">Maintain</text><rect x="1072" y="105" width="116" height="70" rx="14" class="v"/><text x="1130" y="135" text-anchor="middle" class="l">LTS</text><text x="1130" y="156" text-anchor="middle" class="s">Support</text><circle r="8" class="d"><animateMotion dur="6s" repeatCount="indefinite" path="M70 140 H1130"/></circle><text x="600" y="225" text-anchor="middle" class="s">A predictable release model improves customer confidence and operational stability.</text></svg>