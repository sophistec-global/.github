<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">From Product Idea to Production</title>
  <desc id="desc">An eleven-stage product lifecycle from problem discovery through continuous improvement.</desc>
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B5FFF"/><stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#0B5FFF"/><stop offset=".5" stop-color="#00A99D"/><stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-40%" width="160%" height="180%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#0F172A" flood-opacity=".10"/></filter>
    <filter id="glow" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    text{font-family:Inter,Segoe UI,Arial,sans-serif}.bg{fill:#F8FAFC}.eyebrow{font-size:12px;font-weight:700;letter-spacing:2px;fill:#6D28D9}.title{font-size:23px;font-weight:750;fill:#0F172A}.subtitle{font-size:12px;fill:#64748B}.node{fill:#fff;stroke:#D8E1EE;stroke-width:1.5}.node-title{font-size:14px;font-weight:700;fill:#172033}.node-copy{font-size:10px;fill:#64748B}.step{font-size:10px;font-weight:800;fill:#fff}.icon{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.route{fill:none;stroke:url(#trail);stroke-width:3;stroke-linecap:round;opacity:.42}.accent-blue{stroke:#0B5FFF}.accent-teal{stroke:#00A99D}.accent-violet{stroke:#6D28D9}.motion-layer{filter:url(#glow)}
    @media(prefers-color-scheme:dark){.bg{fill:#0B1120}.title,.node-title{fill:#F8FAFC}.subtitle,.node-copy{fill:#94A3B8}.node{fill:#111827;stroke:#334155}}
    @media(prefers-reduced-motion:reduce){.motion-layer{display:none}.node{animation:none}}
  </style>
  <rect width="1200" height="500" rx="26" class="bg"/>
  <text x="600" y="36" text-anchor="middle" class="eyebrow">END-TO-END PRODUCT LIFECYCLE</text>
  <text x="600" y="67" text-anchor="middle" class="title">From Product Idea to Production</text>
  <text x="600" y="90" text-anchor="middle" class="subtitle">Strategy, engineering, intelligence and operations connected in one continuous system</text>

  <!-- Boundary-to-boundary route, rendered beneath every node. -->
  <path d="M260 170H280 M480 170H500 M700 170H720 M920 170H940 M1040 214V286 M940 330H920 M720 330H700 M500 330H480 M280 330H260 M160 374C160 416 315 435 430 435" class="route"/>
  <g class="motion-layer" pointer-events="none">
    <circle r="7" fill="#00D4C7">
      <animateMotion dur="11s" repeatCount="indefinite" path="M160 170H1040V330H160C160 416 315 435 600 435"/>
    </circle>
  </g>

  <!-- 01 Problem -->
  <g filter="url(#shadow)"><rect x="60" y="126" width="200" height="88" rx="17" class="node accent-blue"><animate attributeName="stroke-width" values="1.5;4;1.5" dur="10s" begin="0s" repeatCount="indefinite"/></rect></g>
  <circle cx="84" cy="149" r="14" fill="#0B5FFF"/><text x="84" y="153" text-anchor="middle" class="step">01</text><path d="M111 145a10 10 0 1 0 18 6c0-4-2-6-5-8m-3 18v4m-6 0h12" class="icon accent-blue"/><text x="145" y="157" class="node-title">Problem</text><text x="84" y="190" class="node-copy">Discover the real need</text>
  <!-- 02 Strategy -->
  <g filter="url(#shadow)"><rect x="280" y="126" width="200" height="88" rx="17" class="node accent-teal"><animate attributeName="stroke-width" values="1.5;4;1.5" dur="10s" begin="1s" repeatCount="indefinite"/><animate data-ball-impact="true" attributeName="fill" values="#fff;#00A99D;#fff;#fff" keyTimes="0;.07;.16;1" dur="11s" begin="0.61s" repeatCount="indefinite"/></rect></g>
  <circle cx="304" cy="149" r="14" fill="#00A99D"/><text x="304" y="153" text-anchor="middle" class="step">02<animate data-ball-text-impact="true" attributeName="fill" values="#fff;#FFFFFF;#fff;#fff" keyTimes="0;.07;.16;1" dur="11s" begin="0.61s" repeatCount="indefinite"/></text><path d="M333 159l8-16 8 16m-13-6h10" class="icon accent-teal"/><text x="365" y="157" class="node-title">Product Strategy<animate data-ball-text-impact="true" attributeName="fill" values="#172033;#FFFFFF;#172033;#172033" keyTimes="0;.07;.16;1" dur="11s" begin="0.61s" repeatCount="indefinite"/></text><text x="304" y="190" class="node-copy">Define value and direction<animate data-ball-text-impact="true" attributeName="fill" values="#64748B;#FFFFFF;#64748B;#64748B" keyTimes="0;.07;.16;1" dur="11s" begin="0.61s" repeatCount="indefinite"/></text>
  <!-- 03 Architecture -->
  <g filter="url(#shadow)"><rect x="500" y="126" width="200" height="88" rx="17" class="node accent-violet"><animate attributeName="stroke-width" values="1.5;4;1.5" dur="10s" begin="2s" repeatCount="indefinite"/><animate data-ball-impact="true" attributeName="fill" values="#fff;#6D28D9;#fff;#fff" keyTimes="0;.07;.16;1" dur="11s" begin="1.75s" repeatCount="indefinite"/></rect></g>
  <circle cx="524" cy="149" r="14" fill="#6D28D9"/><text x="524" y="153" text-anchor="middle" class="step">03<animate data-ball-text-impact="true" attributeName="fill" values="#fff;#FFFFFF;#fff;#fff" keyTimes="0;.07;.16;1" dur="11s" begin="1.75s" repeatCount="indefinite"/></text><path d="M554 143h17v17h-17zm4 4h9v9h-9" class="icon accent-violet"/><text x="586" y="151" class="node-title"><tspan x="586" dy="0">System</tspan><tspan x="586" dy="17">Architecture</tspan><animate data-ball-text-impact="true" attributeName="fill" values="#172033;#FFFFFF;#172033;#172033" keyTimes="0;.07;.16;1" dur="11s" begin="1.75s" repeatCount="indefinite"/></text><text x="524" y="190" class="node-copy">Design the connected system<animate data-ball-text-impact="true" attributeName="fill" values="#64748B;#FFFFFF;#64748B;#64748B" keyTimes="0;.07;.16;1" dur="11s" begin="1.75s" repeatCount="indefinite"/></text>
  <!-- 04 UI / UX -->
  <g filter="url(#shadow)"><rect x="720" y="126" width="200" height="88" rx="17" class="node accent-blue"><animate attributeName="stroke-width" values="1.5;4;1.5" dur="10s" begin="3s" repeatCount="indefinite"/><animate data-ball-impact="true" attributeName="fill" values="#fff;#0B5FFF;#fff;#fff" keyTimes="0;.07;.16;1" dur="11s" begin="2.85s" repeatCount="indefinite"/></rect></g>
  <circle cx="744" cy="149" r="14" fill="#0B5FFF"/><text x="744" y="153" text-anchor="middle" class="step">04<animate data-ball-text-impact="true" attributeName="fill" values="#fff;#FFFFFF;#fff;#fff" keyTimes="0;.07;.16;1" dur="11s" begin="2.85s" repeatCount="indefinite"/></text><rect x="773" y="142" width="18" height="19" rx="2" class="icon accent-blue"/><path d="M776 147h12m-12 4h7" class="icon accent-blue"/><text x="804" y="157" class="node-title">UI / UX</text><text x="744" y="190" class="node-copy">Shape clear human experiences</text>
  <!-- 05 Build -->
  <g filter="url(#shadow)"><rect x="940" y="126" width="200" height="88" rx="17" class="node accent-teal"><animate attributeName="stroke-width" values="1.5;4;1.5" dur="10s" begin="4s" repeatCount="indefinite"/></rect></g>
  <circle cx="964" cy="149" r="14" fill="#00A99D"/><text x="964" y="153" text-anchor="middle" class="step">05</text><path d="M995 143l-7 8 7 8m12-16 7 8-7 8m-7-19-4 22" class="icon accent-teal"/><text x="1020" y="151" class="node-title"><tspan x="1020" dy="0">Frontend +</tspan><tspan x="1020" dy="17">Backend</tspan></text><text x="964" y="190" class="node-copy">Build reliable product foundations</text>
  <!-- 06 Data -->
  <g filter="url(#shadow)"><rect x="940" y="286" width="200" height="88" rx="17" class="node accent-violet"><animate attributeName="stroke-width" values="1.5;4;1.5" dur="10s" begin="5s" repeatCount="indefinite"/><animate data-ball-impact="true" attributeName="fill" values="#fff;#6D28D9;#fff;#fff" keyTimes="0;.07;.16;1" dur="11s" begin="5.09s" repeatCount="indefinite"/></rect></g>
  <circle cx="964" cy="309" r="14" fill="#6D28D9"/><text x="964" y="313" text-anchor="middle" class="step">06<animate data-ball-text-impact="true" attributeName="fill" values="#fff;#FFFFFF;#fff;#fff" keyTimes="0;.07;.16;1" dur="11s" begin="5.09s" repeatCount="indefinite"/></text><ellipse cx="996" cy="304" rx="10" ry="4" class="icon accent-violet"/><path d="M986 304v15c0 5 20 5 20 0v-15m-20 8c0 5 20 5 20 0" class="icon accent-violet"/><text x="1020" y="311" class="node-title"><tspan x="1020" dy="0">Data +</tspan><tspan x="1020" dy="17">Integrations</tspan><animate data-ball-text-impact="true" attributeName="fill" values="#172033;#FFFFFF;#172033;#172033" keyTimes="0;.07;.16;1" dur="11s" begin="5.09s" repeatCount="indefinite"/></text><text x="964" y="350" class="node-copy">Connect knowledge and services<animate data-ball-text-impact="true" attributeName="fill" values="#64748B;#FFFFFF;#64748B;#64748B" keyTimes="0;.07;.16;1" dur="11s" begin="5.09s" repeatCount="indefinite"/></text>
  <!-- 07 AI -->
  <g filter="url(#shadow)"><rect x="720" y="286" width="200" height="88" rx="17" class="node accent-blue"><animate attributeName="stroke-width" values="1.5;4;1.5" dur="10s" begin="6s" repeatCount="indefinite"/><animate data-ball-impact="true" attributeName="fill" values="#fff;#0B5FFF;#fff;#fff" keyTimes="0;.07;.16;1" dur="11s" begin="5.91s" repeatCount="indefinite"/></rect></g>
  <circle cx="744" cy="309" r="14" fill="#0B5FFF"/><text x="744" y="313" text-anchor="middle" class="step">07<animate data-ball-text-impact="true" attributeName="fill" values="#fff;#FFFFFF;#fff;#fff" keyTimes="0;.07;.16;1" dur="11s" begin="5.91s" repeatCount="indefinite"/></text><path d="M779 299v20m-10-10h20m-16-6 12 12m0-12-12 12" class="icon accent-blue"/><text x="804" y="317" class="node-title">AI / Automation<animate data-ball-text-impact="true" attributeName="fill" values="#172033;#FFFFFF;#172033;#172033" keyTimes="0;.07;.16;1" dur="11s" begin="5.91s" repeatCount="indefinite"/></text><text x="744" y="350" class="node-copy">Augment decisions and workflows<animate data-ball-text-impact="true" attributeName="fill" values="#64748B;#FFFFFF;#64748B;#64748B" keyTimes="0;.07;.16;1" dur="11s" begin="5.91s" repeatCount="indefinite"/></text>
  <!-- 08 Quality -->
  <g filter="url(#shadow)"><rect x="500" y="286" width="200" height="88" rx="17" class="node accent-teal"><animate attributeName="stroke-width" values="1.5;4;1.5" dur="10s" begin="7s" repeatCount="indefinite"/><animate data-ball-impact="true" attributeName="fill" values="#fff;#00A99D;#fff;#fff" keyTimes="0;.07;.16;1" dur="11s" begin="7.05s" repeatCount="indefinite"/></rect></g>
  <circle cx="524" cy="309" r="14" fill="#00A99D"/><text x="524" y="313" text-anchor="middle" class="step">08<animate data-ball-text-impact="true" attributeName="fill" values="#fff;#FFFFFF;#fff;#fff" keyTimes="0;.07;.16;1" dur="11s" begin="7.05s" repeatCount="indefinite"/></text><path d="M556 300l10 4v8c0 7-5 10-10 12-5-2-10-5-10-12v-8zm-5 11 4 4 7-8" class="icon accent-teal"/><text x="586" y="311" class="node-title"><tspan x="586" dy="0">Testing +</tspan><tspan x="586" dy="17">Security</tspan><animate data-ball-text-impact="true" attributeName="fill" values="#172033;#FFFFFF;#172033;#172033" keyTimes="0;.07;.16;1" dur="11s" begin="7.05s" repeatCount="indefinite"/></text><text x="524" y="350" class="node-copy">Verify quality, safety and trust<animate data-ball-text-impact="true" attributeName="fill" values="#64748B;#FFFFFF;#64748B;#64748B" keyTimes="0;.07;.16;1" dur="11s" begin="7.05s" repeatCount="indefinite"/></text>
  <!-- 09 Deploy -->
  <g filter="url(#shadow)"><rect x="280" y="286" width="200" height="88" rx="17" class="node accent-violet"><animate attributeName="stroke-width" values="1.5;4;1.5" dur="10s" begin="8s" repeatCount="indefinite"/><animate data-ball-impact="true" attributeName="fill" values="#fff;#6D28D9;#fff;#fff" keyTimes="0;.07;.16;1" dur="11s" begin="8.15s" repeatCount="indefinite"/></rect></g>
  <circle cx="304" cy="309" r="14" fill="#6D28D9"/><text x="304" y="313" text-anchor="middle" class="step">09<animate data-ball-text-impact="true" attributeName="fill" values="#fff;#FFFFFF;#fff;#fff" keyTimes="0;.07;.16;1" dur="11s" begin="8.15s" repeatCount="indefinite"/></text><path d="M337 320v-18m-7 7 7-7 7 7m-14 12h14" class="icon accent-violet"/><text x="365" y="317" class="node-title">Deployment<animate data-ball-text-impact="true" attributeName="fill" values="#172033;#FFFFFF;#172033;#172033" keyTimes="0;.07;.16;1" dur="11s" begin="8.15s" repeatCount="indefinite"/></text><text x="304" y="350" class="node-copy">Release with control and confidence<animate data-ball-text-impact="true" attributeName="fill" values="#64748B;#FFFFFF;#64748B;#64748B" keyTimes="0;.07;.16;1" dur="11s" begin="8.15s" repeatCount="indefinite"/></text>
  <!-- 10 Monitor -->
  <g filter="url(#shadow)"><rect x="60" y="286" width="200" height="88" rx="17" class="node accent-blue"><animate attributeName="stroke-width" values="1.5;4;1.5" dur="10s" begin="9s" repeatCount="indefinite"/><animate data-ball-impact="true" attributeName="fill" values="#fff;#0B5FFF;#fff;#fff" keyTimes="0;.07;.16;1" dur="11s" begin="9.29s" repeatCount="indefinite"/></rect></g>
  <circle cx="84" cy="309" r="14" fill="#0B5FFF"/><text x="84" y="313" text-anchor="middle" class="step">10<animate data-ball-text-impact="true" attributeName="fill" values="#fff;#FFFFFF;#fff;#fff" keyTimes="0;.07;.16;1" dur="11s" begin="9.29s" repeatCount="indefinite"/></text><path d="M110 319v-18m7 18v-11m7 11v-7m7 7v-14" class="icon accent-blue"/><text x="145" y="317" class="node-title">Monitoring<animate data-ball-text-impact="true" attributeName="fill" values="#172033;#FFFFFF;#172033;#172033" keyTimes="0;.07;.16;1" dur="11s" begin="9.29s" repeatCount="indefinite"/></text><text x="84" y="350" class="node-copy">Observe health, usage and impact<animate data-ball-text-impact="true" attributeName="fill" values="#64748B;#FFFFFF;#64748B;#64748B" keyTimes="0;.07;.16;1" dur="11s" begin="9.29s" repeatCount="indefinite"/></text>

  <!-- 11 Improve -->
  <g filter="url(#shadow)"><rect x="430" y="402" width="340" height="66" rx="20" fill="url(#hero)" stroke="#6D28D9" stroke-width="1.5"><animate attributeName="stroke-width" values="1.5;5;1.5" dur="11s" begin="10s" repeatCount="indefinite"/><animate data-ball-impact="true" attributeName="fill" values="#6D28D9;#00A99D;#6D28D9;#6D28D9" keyTimes="0;.07;.16;1" dur="11s" begin="10.76s" repeatCount="indefinite"/></rect></g>
  <circle cx="463" cy="435" r="17" fill="#fff" opacity=".18"/><text x="463" y="439" text-anchor="middle" class="step">11<animate data-ball-text-impact="true" attributeName="fill" values="#fff;#FFFFFF;#fff;#fff" keyTimes="0;.07;.16;1" dur="11s" begin="10.76s" repeatCount="indefinite"/></text><path d="M492 443a11 11 0 1 1 8 3m0 0v-7m0 7h-7" class="icon" stroke="#fff"/><text x="526" y="431" style="font:700 15px Inter,Segoe UI,Arial,sans-serif;fill:#fff">Continuous Improvement<animate data-ball-text-impact="true" attributeName="fill" values="#fff;#FFFFFF;#fff;#fff" keyTimes="0;.07;.16;1" dur="11s" begin="10.76s" repeatCount="indefinite"/></text><text x="526" y="451" style="font:10px Inter,Segoe UI,Arial,sans-serif;fill:#EDE9FE">Learn continuously · improve deliberately · evolve safely<animate data-ball-text-impact="true" attributeName="fill" values="#EDE9FE;#FFFFFF;#EDE9FE;#EDE9FE" keyTimes="0;.07;.16;1" dur="11s" begin="10.76s" repeatCount="indefinite"/></text>
</svg>
