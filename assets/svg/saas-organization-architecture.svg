<svg data-readable-timing="3x" xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">SaaS Organization and Identity Architecture</title>
  <desc id="desc">Users authenticate into an organization or tenant with teams, roles, entitlements, billing, usage and audit capabilities connected to SaaS products.</desc>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B5FFF"/><stop offset=".55" stop-color="#6D28D9"/><stop offset="1" stop-color="#00A99D"/></linearGradient>
    <filter id="shadow" x="-25%" y="-45%" width="150%" height="190%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#0F172A" flood-opacity=".11"/></filter>
    <filter id="glow" x="-180%" y="-180%" width="460%" height="460%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    text{font-family:Inter,Segoe UI,Arial,sans-serif}.bg{fill:#F8FAFC}.eyebrow{font-size:11px;font-weight:700;letter-spacing:2px;fill:#6D28D9}.heading{font-size:22px;font-weight:750;fill:#0F172A}.sub{font-size:10px;fill:#64748B}.card{fill:#fff;stroke-width:1.8}.label{font-size:14px;font-weight:750;fill:#172033}.copy{font-size:10px;fill:#64748B}.step{font-size:10px;font-weight:800;fill:#fff}.blue{stroke:#0B5FFF}.teal{stroke:#00A99D}.violet{stroke:#6D28D9}.navy{stroke:#1D3557}.line{fill:none;stroke:#CBD5E1;stroke-width:2.3;stroke-linecap:round}.dash{fill:none;stroke:#94A3B8;stroke-width:1.8;stroke-dasharray:6 6}.icon{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.motion{filter:url(#glow)}
    @media(prefers-color-scheme:dark){.bg{fill:#0B1120}.heading,.label{fill:#F8FAFC}.sub,.copy{fill:#94A3B8}.card{fill:#111827}.line{stroke:#475569}.dash{stroke:#64748B}}
    svg:has(.hover-users:hover) rect[x="80"][y="100"]{fill:#0B5FFF!important}svg:has(.hover-users:hover) path[d^="M145 133"],svg:has(.hover-users:hover) text[y="130"],svg:has(.hover-users:hover) text[y="149"]{stroke:#fff!important;fill:#fff!important}
    svg:has(.hover-identity:hover) rect[x="80"][y="193"]{fill:#007F75!important}svg:has(.hover-identity:hover) path[d^="M148 226"],svg:has(.hover-identity:hover) text[y="223"],svg:has(.hover-identity:hover) text[y="242"]{stroke:#fff!important;fill:#fff!important}
    svg:has(.hover-tenant:hover) rect[x="80"][y="286"]{fill:#6D28D9!important}svg:has(.hover-tenant:hover) path[d^="M145 333"],svg:has(.hover-tenant:hover) text[y="316"],svg:has(.hover-tenant:hover) text[y="335"]{stroke:#fff!important;fill:#fff!important}
    svg:has(.hover-products:hover) rect[x="80"][y="438"]{fill:#0B5FFF!important}svg:has(.hover-products:hover) path[d^="M145 472"],svg:has(.hover-products:hover) text[y="468"],svg:has(.hover-products:hover) text[y="487"]{stroke:#fff!important;fill:#fff!important}
    .hover-zone{fill:transparent;pointer-events:all;cursor:pointer}
    @media(prefers-reduced-motion:reduce){.motion{display:none}}
  </style>
  <rect width="1200" height="560" rx="26" class="bg"/>
  <text x="600" y="35" text-anchor="middle" class="eyebrow">IDENTITY · TENANCY · ENTITLEMENTS</text>
  <text x="600" y="65" text-anchor="middle" class="heading">Connected SaaS Organization Architecture</text>
  <text x="600" y="87" text-anchor="middle" class="sub">One trusted identity layer connecting organizations, access, commercial controls and products.</text>

