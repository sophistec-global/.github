  <circle cx="112" cy="227" r="17" fill="#00A99D"/><text x="112" y="231" text-anchor="middle" class="step">02<animate data-ball-text-impact="true" attributeName="fill" values="#fff;#FFFFFF;#FFFFFF;#fff;#fff" keyTimes="0;.0333;.2;.2333;1" dur="12s" begin="3s" repeatCount="indefinite"/></text><path d="M148 226v-8a9 9 0 0 1 18 0v8m-21 0h24v18h-24zm12 7v5" class="icon" stroke="#00A99D"><animate data-ball-icon-impact="true" attributeName="stroke" values="#00A99D;#FFFFFF;#FFFFFF;#00A99D;#00A99D" keyTimes="0;.0333;.2;.2333;1" dur="12s" begin="3s" repeatCount="indefinite"/></path><text x="186" y="223" class="label">Identity &amp; Authentication<animate data-ball-text-impact="true" attributeName="fill" values="#172033;#FFFFFF;#FFFFFF;#172033;#172033" keyTimes="0;.0333;.2;.2333;1" dur="12s" begin="3s" repeatCount="indefinite"/></text><text x="186" y="242" class="copy">SSO · OAuth · JWT · secure sessions<animate data-ball-text-impact="true" attributeName="fill" values="#64748B;#FFFFFF;#FFFFFF;#64748B;#64748B" keyTimes="0;.0333;.2;.2333;1" dur="12s" begin="3s" repeatCount="indefinite"/></text>

