  <circle cx="112" cy="472" r="17" fill="#fff" opacity=".18"/><text x="112" y="476" text-anchor="middle" class="step">04<animate data-ball-text-impact="true" attributeName="fill" values="#fff;#FFFFFF;#FFFFFF;#fff;#fff" keyTimes="0;.0333;.2;.2333;1" dur="12s" begin="9s" repeatCount="indefinite"/></text><path d="M145 472h25m-6-7 7 7-7 7" class="icon" stroke="#fff"><animate data-ball-icon-impact="true" attributeName="stroke" values="#fff;#FFFFFF;#FFFFFF;#fff;#fff" keyTimes="0;.0333;.2;.2333;1" dur="12s" begin="9s" repeatCount="indefinite"/></path><text x="186" y="468" style="font:750 14px Inter,Segoe UI,Arial,sans-serif;fill:#fff">Connected SaaS Products<animate data-ball-text-impact="true" attributeName="fill" values="#fff;#FFFFFF;#FFFFFF;#fff;#fff" keyTimes="0;.0333;.2;.2333;1" dur="12s" begin="9s" repeatCount="indefinite"/></text><text x="186" y="487" style="font:10px Inter,Segoe UI,Arial,sans-serif;fill:#E0F2FE">Organization-aware product access<animate data-ball-text-impact="true" attributeName="fill" values="#E0F2FE;#FFFFFF;#FFFFFF;#E0F2FE;#E0F2FE" keyTimes="0;.0333;.2;.2333;1" dur="12s" begin="9s" repeatCount="indefinite"/></text>

  <text x="520" y="134" class="eyebrow">TENANT CAPABILITIES</text>
