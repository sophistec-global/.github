<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270"><title>Reliability and SRE Model</title><style>text{font-family:Arial,sans-serif}.bg{fill:#F8FAFC}.h{font-size:21px;font-weight:700;fill:#0F172A}.l{font-size:12px;font-weight:700;fill:#1E293B}.s{font-size:10px;fill:#64748B}.b{fill:#EAF2FF;stroke:#0B5FFF;stroke-width:2}.t{fill:#E8FBF7;stroke:#00A99D;stroke-width:2}.v{fill:#F3EEFF;stroke:#6D28D9;stroke-width:2}.n{fill:#EEF2F7;stroke:#1D3557;stroke-width:2}.line{stroke:#CBD5E1;stroke-width:3}.d{fill:#00A99D}/* node-impact-effect */.motion-layer{filter:drop-shadow(0 0 7px #00A99D);opacity:.95}rect:not(.bg){fill-opacity:.96}@media(prefers-reduced-motion:reduce){.motion-layer{display:none}}</style><rect class="bg" width="1200" height="270" rx="24"/><text x="600" y="34" text-anchor="middle" class="h">Reliability and SRE Model</text><path d="M70 140 H1130" class="line"/><g class="motion-layer" pointer-events="none"><circle r="8" class="d"><animateMotion dur="6s" repeatCount="indefinite" path="M70 140 H1130"/></circle></g><rect x="12" y="105" width="116" height="70" rx="14" class="b"/><text x="70" y="135" text-anchor="middle" class="l">SLI</text><text x="70" y="156" text-anchor="middle" class="s">Measure</text><rect x="189" y="105" width="116" height="70" rx="14" class="t"/><text x="247" y="135" text-anchor="middle" class="l">SLO</text><text x="247" y="156" text-anchor="middle" class="s">Target</text><rect x="365" y="105" width="116" height="70" rx="14" class="v"/><text x="423" y="135" text-anchor="middle" class="l">SLA</text><text x="423" y="156" text-anchor="middle" class="s">Commit</text><rect x="542" y="105" width="116" height="70" rx="14" class="n"/><text x="600" y="135" text-anchor="middle" class="l">RTO</text><text x="600" y="156" text-anchor="middle" class="s">Recover</text><rect x="719" y="105" width="116" height="70" rx="14" class="b"/><text x="777" y="135" text-anchor="middle" class="l">RPO</text><text x="777" y="156" text-anchor="middle" class="s">Data</text><rect x="895" y="105" width="116" height="70" rx="14" class="t"/><text x="953" y="135" text-anchor="middle" class="l">DR</text><text x="953" y="156" text-anchor="middle" class="s">Failover</text><rect x="1072" y="105" width="116" height="70" rx="14" class="v"/><text x="1130" y="135" text-anchor="middle" class="l">Review</text><text x="1130" y="156" text-anchor="middle" class="s">Improve</text><text x="600" y="225" text-anchor="middle" class="s">Availability, latency, errors, recovery, continuity.</text></svg>