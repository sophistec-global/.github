<svg data-readable-timing="3x" xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<title id="title">Enterprise Integration Ecosystem</title><desc id="desc">An application connects through an integration layer to internal services, external APIs, payment systems, marketplaces, logistics, government and healthcare systems, AI providers, and third-party SaaS.</desc>
<defs><filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity=".09"/></filter><linearGradient id="g" x2="1" y2="1"><stop stop-color="#0B5FFF"/><stop offset="1" stop-color="#6D28D9"/></linearGradient><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#94A3B8"/></marker></defs>
<style>text{font-family:Arial,sans-serif}.bg{fill:#F8FAFC}.title{font-size:24px;font-weight:700;fill:#0F172A}.label{font-size:13px;font-weight:700;fill:#1E293B}.small{font-size:10px;fill:#64748B}.white{fill:#fff}.card{fill:#fff;stroke-width:1.7}.b{stroke:#0B5FFF}.t{stroke:#00A99D}.v{stroke:#6D28D9}.n{stroke:#1D3557}.bus{fill:none;stroke:#CBD5E1;stroke-width:2}.line{fill:none;stroke:#94A3B8;stroke-width:2;marker-end:url(#a)}.pulse{fill:#00A99D}@media(prefers-color-scheme:dark){.bg{fill:#0B1120}.title,.label{fill:#F8FAFC}.small{fill:#94A3B8}.card{fill:#111827}.bus{stroke:#475569}.line{stroke:#64748B}}/* node-impact-effect */.motion-layer{filter:drop-shadow(0 0 7px #00A99D);opacity:.95}rect:not(.bg){fill-opacity:.96}@media(prefers-reduced-motion:reduce){.motion-layer{display:none}}</style>
<rect width="1200" height="500" rx="24" class="bg"/><text x="600" y="38" text-anchor="middle" class="title">Enterprise Integration Ecosystem</text><text x="600" y="60" text-anchor="middle" class="small">One controlled layer connecting internal capabilities and external ecosystems</text>
<!-- Connectors are behind cards and terminate at each card boundary. -->
<path d="M120 258H1080" class="bus"/><path d="M600 126V150M600 230V258M120 258V286M400 258V286M800 258V286M1080 258V286M250 258V417H210M540 258V417H490M660 258V417H710M950 258V417H990" class="line"/>
<g filter="url(#s)"><g class="motion-layer" pointer-events="none"><circle r="6" class="pulse"><animateMotion dur="15s" repeatCount="indefinite" path="M600 126V190V258H800V286"/></circle></g><rect x="500" y="80" width="200" height="46" rx="14" class="card b"><animate data-ball-impact="true" attributeName="fill" values="#fff;#0B5FFF;#0B5FFF;#fff;#fff" keyTimes="0;0.0267;0.1600;0.1867;1" dur="15s" begin="0s" repeatCount="indefinite"/></rect><text x="600" y="108" text-anchor="middle" class="label">APPLICATION<animate data-ball-text-impact="true" attributeName="fill" values="#1E293B;#FFFFFF;#1E293B;#1E293B" keyTimes="0;0.0267;0.1600;0.1867;1" dur="15s" begin="0s" repeatCount="indefinite"/></text><rect x="450" y="150" width="300" height="80" rx="20" fill="url(#g)"><animate data-ball-impact="true" attributeName="fill" values="#0B5FFF;#0B5FFF;#0B5FFF;#0B5FFF;#0B5FFF" keyTimes="0;0.0267;0.1600;0.1867;1" dur="15s" begin="0.99s" repeatCount="indefinite"/></rect><text x="600" y="184" text-anchor="middle" class="label white">INTEGRATION LAYER<animate data-ball-text-impact="true" attributeName="fill" values="#fff;#FFFFFF;#fff;#fff" keyTimes="0;0.0267;0.1600;0.1867;1" dur="15s" begin="0.99s" repeatCount="indefinite"/></text><text x="600" y="207" text-anchor="middle" class="small white">Secure APIs · events · policies · observability<animate data-ball-text-impact="true" attributeName="fill" values="#fff;#FFFFFF;#fff;#fff" keyTimes="0;0.0267;0.1600;0.1867;1" dur="15s" begin="0.99s" repeatCount="indefinite"/></text>
<g transform="translate(30 286)"><rect width="180" height="70" rx="14" class="card b"/><text x="90" y="30" text-anchor="middle" class="label">Internal Services</text><text x="90" y="50" text-anchor="middle" class="small">Enterprise systems</text></g><g transform="translate(310 286)"><rect width="180" height="70" rx="14" class="card t"/><text x="90" y="30" text-anchor="middle" class="label">External APIs</text><text x="90" y="50" text-anchor="middle" class="small">Partners · platforms</text></g><g transform="translate(710 286)"><rect width="180" height="70" rx="14" class="card v"/><text x="90" y="30" text-anchor="middle" class="label">Payment</text><text x="90" y="50" text-anchor="middle" class="small">Gateways · transactions</text></g><g transform="translate(990 286)"><rect width="180" height="70" rx="14" class="card n"/><text x="90" y="30" text-anchor="middle" class="label">Marketplace</text><text x="90" y="50" text-anchor="middle" class="small">Orders · channels</text></g>
<g transform="translate(30 382)"><rect width="180" height="70" rx="14" class="card t"/><text x="90" y="30" text-anchor="middle" class="label">Logistics</text><text x="90" y="50" text-anchor="middle" class="small">Shipping · fulfillment</text></g><g transform="translate(310 382)"><rect width="180" height="70" rx="14" class="card n"/><text x="90" y="28" text-anchor="middle" class="label">Government /</text><text x="90" y="45" text-anchor="middle" class="label">Healthcare</text><text x="90" y="61" text-anchor="middle" class="small">Public &amp; clinical systems</text></g><g transform="translate(710 382)"><rect width="180" height="70" rx="14" class="card b"/><text x="90" y="30" text-anchor="middle" class="label">AI Providers</text><text x="90" y="50" text-anchor="middle" class="small">Models · intelligence</text></g><g transform="translate(990 382)"><rect width="180" height="70" rx="14" class="card v"/><text x="90" y="30" text-anchor="middle" class="label">Third-Party SaaS</text><text x="90" y="50" text-anchor="middle" class="small">Business applications</text></g></g>
<text x="600" y="480" text-anchor="middle" class="small">Authenticated · observable · resilient · independently evolvable<animate data-ball-text-impact="true" attributeName="fill" values="#64748B;#FFFFFF;#64748B;#64748B" keyTimes="0;0.0267;0.1600;0.1867;1" dur="15s" begin="0s" repeatCount="indefinite"/></text>
</svg>
