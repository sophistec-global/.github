<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270"><style>
text{font-family:Arial,sans-serif}.bg{fill:#F8FAFC}.title{font-size:21px;font-weight:700;fill:#0F172A}.label{font-size:13px;font-weight:700;fill:#1E293B}.small{font-size:11px;fill:#64748B}
.b{fill:#EAF2FF;stroke:#0B5FFF;stroke-width:2}.t{fill:#E8FBF7;stroke:#00A99D;stroke-width:2}.v{fill:#F3EEFF;stroke:#6D28D9;stroke-width:2}.n{fill:#EEF2F7;stroke:#1D3557;stroke-width:2}.line{stroke:#CBD5E1;stroke-width:4;fill:none}.dot{fill:#00A99D}
@media(prefers-color-scheme:dark){.bg{fill:#0B1120}.title,.label{fill:#F8FAFC}.small{fill:#94A3B8}.b,.t,.v,.n{fill:#111827}.line{stroke:#475569}}
/* node-impact-effect */.motion-layer{filter:drop-shadow(0 0 7px #00A99D);opacity:.95}rect:not(.bg){fill-opacity:.96}@media(prefers-reduced-motion:reduce){.motion-layer{display:none}}</style><rect class="bg" width="1200" height="270" rx="24"/><text x="600.0" y="34" text-anchor="middle" class="title">Observability &amp; Reliability</text><path d="M80 140 H1120" class="line"/><g class="motion-layer" pointer-events="none"><circle r="8" class="dot"><animateMotion dur="7s" repeatCount="indefinite" path="M80 140 H1120"/></circle></g><rect x="20" y="105" width="120" height="70" rx="14" class="b"/><text x="80" y="135" text-anchor="middle" class="label">Runtime</text><text x="80" y="156" text-anchor="middle" class="small">Systems</text><rect x="193" y="105" width="120" height="70" rx="14" class="t"/><text x="253" y="135" text-anchor="middle" class="label">Logs</text><text x="253" y="156" text-anchor="middle" class="small">Events</text><rect x="367" y="105" width="120" height="70" rx="14" class="v"/><text x="427" y="135" text-anchor="middle" class="label">Metrics</text><text x="427" y="156" text-anchor="middle" class="small">Health</text><rect x="540" y="105" width="120" height="70" rx="14" class="n"/><text x="600" y="135" text-anchor="middle" class="label">Traces</text><text x="600" y="156" text-anchor="middle" class="small">Flow</text><rect x="713" y="105" width="120" height="70" rx="14" class="b"/><text x="773" y="135" text-anchor="middle" class="label">Alerts</text><text x="773" y="156" text-anchor="middle" class="small">Detect</text><rect x="887" y="105" width="120" height="70" rx="14" class="t"/><text x="947" y="135" text-anchor="middle" class="label">Diagnose</text><text x="947" y="156" text-anchor="middle" class="small">Understand</text><rect x="1060" y="105" width="120" height="70" rx="14" class="v"/><text x="1120" y="135" text-anchor="middle" class="label">Improve</text><text x="1120" y="156" text-anchor="middle" class="small">Reliability</text><text x="600.0" y="225" text-anchor="middle" class="small">Production telemetry becomes a continuous engineering feedback loop</text></svg>