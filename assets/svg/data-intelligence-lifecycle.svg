<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img"><title>Data Lifecycle</title><desc>Operational data to intelligence lifecycle.</desc><style>
text{font-family:Arial,sans-serif}.bg{fill:#F8FAFC}.title{font-size:22px;font-weight:700;fill:#0F172A}.label{font-size:14px;font-weight:700;fill:#1E293B}.small{font-size:11px;fill:#64748B}
.blue{fill:#EAF2FF;stroke:#0B5FFF;stroke-width:2}.teal{fill:#E8FBF7;stroke:#00A99D;stroke-width:2}.violet{fill:#F3EEFF;stroke:#6D28D9;stroke-width:2}.navy{fill:#EEF2F7;stroke:#1D3557;stroke-width:2}.panel{fill:#fff;stroke:#D8E1EE;stroke-width:1.5}
.line{stroke:#CBD5E1;stroke-width:2;fill:none}.dash{stroke:#94A3B8;stroke-width:2;fill:none;stroke-dasharray:7 7}.db{fill:#0B5FFF}.dt{fill:#00A99D}.dv{fill:#6D28D9}
@media(prefers-color-scheme:dark){.bg{fill:#0B1120}.title,.label{fill:#F8FAFC}.small{fill:#94A3B8}.blue,.teal,.violet,.navy,.panel{fill:#111827}.line,.dash{stroke:#475569}}
/* node-impact-effect */.motion-layer{filter:drop-shadow(0 0 7px #00A99D);opacity:.95}rect:not(.bg){fill-opacity:.96}@media(prefers-reduced-motion:reduce){.motion-layer{display:none}}</style><rect width="1200" height="300" rx="24" class="bg"/><text x="600" y="34" text-anchor="middle" class="title">Data → Intelligence Lifecycle</text><path d="M80 145 H1118" class="line"/><g class="motion-layer" pointer-events="none"><circle r="8" class="dt"><animateMotion dur="6s" repeatCount="indefinite" path="M80 145 H1118"/></circle></g><rect x="18" y="110" width="124" height="70" rx="15" class="teal"><animate data-ball-impact="true" attributeName="fill" values="#E8FBF7;#5EEAD4;#E8FBF7;#E8FBF7" keyTimes="0;.07;.16;1" dur="6s" begin="0.00s" repeatCount="indefinite"/></rect><text x="80.0" y="139" text-anchor="middle" class="label">Ingest</text><text x="80.0" y="160" text-anchor="middle" class="small">APIs · Events</text><rect x="191" y="110" width="124" height="70" rx="15" class="blue"><animate data-ball-impact="true" attributeName="fill" values="#EAF2FF;#93C5FD;#EAF2FF;#EAF2FF" keyTimes="0;.07;.16;1" dur="6s" begin="0.65s" repeatCount="indefinite"/></rect><text x="253.0" y="139" text-anchor="middle" class="label">Validate</text><text x="253.0" y="160" text-anchor="middle" class="small">Quality</text><rect x="364" y="110" width="124" height="70" rx="15" class="navy"><animate data-ball-impact="true" attributeName="fill" values="#EEF2F7;#93C5FD;#EEF2F7;#EEF2F7" keyTimes="0;.07;.16;1" dur="6s" begin="1.66s" repeatCount="indefinite"/></rect><text x="426.0" y="139" text-anchor="middle" class="label">Store</text><text x="426.0" y="160" text-anchor="middle" class="small">SQL · Object</text><rect x="537" y="110" width="124" height="70" rx="15" class="blue"><animate data-ball-impact="true" attributeName="fill" values="#EAF2FF;#93C5FD;#EAF2FF;#EAF2FF" keyTimes="0;.07;.16;1" dur="6s" begin="2.68s" repeatCount="indefinite"/></rect><text x="599.0" y="139" text-anchor="middle" class="label">Transform</text><text x="599.0" y="160" text-anchor="middle" class="small">ETL / ELT</text><rect x="710" y="110" width="124" height="70" rx="15" class="violet"><animate data-ball-impact="true" attributeName="fill" values="#F3EEFF;#C4B5FD;#F3EEFF;#F3EEFF" keyTimes="0;.07;.16;1" dur="6s" begin="3.65s" repeatCount="indefinite"/></rect><text x="772.0" y="139" text-anchor="middle" class="label">Analyze</text><text x="772.0" y="160" text-anchor="middle" class="small">BI · ML</text><rect x="883" y="110" width="124" height="70" rx="15" class="violet"><animate data-ball-impact="true" attributeName="fill" values="#F3EEFF;#C4B5FD;#F3EEFF;#F3EEFF" keyTimes="0;.07;.16;1" dur="6s" begin="4.66s" repeatCount="indefinite"/></rect><text x="945.0" y="139" text-anchor="middle" class="label">Retrieve</text><text x="945.0" y="160" text-anchor="middle" class="small">Search · Vector</text><rect x="1056" y="110" width="124" height="70" rx="15" class="teal"><animate data-ball-impact="true" attributeName="fill" values="#E8FBF7;#5EEAD4;#E8FBF7;#E8FBF7" keyTimes="0;.07;.16;1" dur="6s" begin="5.68s" repeatCount="indefinite"/></rect><text x="1118.0" y="139" text-anchor="middle" class="label">Activate</text><text x="1118.0" y="160" text-anchor="middle" class="small">Product · AI</text></svg>