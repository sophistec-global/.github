<defs><filter id="s" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0F172A" flood-opacity=".09"/></filter><linearGradient id="hub" x2="1" y2="1"><stop stop-color="#0B5FFF"/><stop offset="1" stop-color="#6D28D9"/></linearGradient></defs>
<style>text{font-family:Arial,sans-serif}.bg{fill:#F8FAFC}.title{font-size:24px;font-weight:700;fill:#0F172A}.sub{font-size:11px;fill:#64748B}.label{font-size:13px;font-weight:700;fill:#1E293B}.card{fill:#fff;stroke-width:1.5}.b{stroke:#0B5FFF}.t{stroke:#00A99D}.v{stroke:#6D28D9}.n{stroke:#1D3557}.logo{fill:#F8FAFC;stroke:#D8E1EE}.line{fill:none;stroke:#CBD5E1;stroke-width:2}.white{fill:#fff}.pulse{fill:#00A99D}@media(prefers-color-scheme:dark){.bg{fill:#0B1120}.title,.label{fill:#F8FAFC}.sub{fill:#94A3B8}.card{fill:#111827}.line{stroke:#475569}}/* node-impact-effect */.motion-layer{filter:drop-shadow(0 0 7px #00A99D);opacity:.95}rect:not(.bg){fill-opacity:.96}@media(prefers-reduced-motion:reduce){.motion-layer{display:none}}</style>
