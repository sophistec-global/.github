/* node-impact-effect */.motion-layer{filter:drop-shadow(0 0 7px #00A99D);opacity:.95}rect:not(.bg){fill-opacity:.96}@media(prefers-reduced-motion:reduce){.motion-layer{display:none}}</style><rect class="bg" width="1200" height="270" rx="24"/><text x="600.0" y="34" text-anchor="middle" class="title">AI-Native Intelligence Layer</text><path d="M80 140 H1120" class="line"/><g class="motion-layer" pointer-events="none"><circle r="8" class="dot"><animateMotion dur="7s" repeatCount="indefinite" path="M80 140 H1120"/></circle></g><rect x="20" y="105" width="120" height="70" rx="14" class="b"><animate data-ball-impact="true" attributeName="fill" values="#EAF2FF;#DBEAFE;#EAF2FF;#EAF2FF" keyTimes="0;.07;.16;1" dur="7s" begin="0.00s" repeatCount="indefinite"/></rect><text x="80" y="135" text-anchor="middle" class="label">User</text><text x="80" y="156" text-anchor="middle" class="small">Intent</text><rect x="193" y="105" width="120" height="70" rx="14" class="t"><animate data-ball-impact="true" attributeName="fill" values="#E8FBF7;#DBEAFE;#E8FBF7;#E8FBF7" keyTimes="0;.07;.16;1" dur="7s" begin="0.81s" repeatCount="indefinite"/></rect><text x="253" y="135" text-anchor="middle" class="label">Agent</text><text x="253" y="156" text-anchor="middle" class="small">Orchestrate</text><rect x="367" y="105" width="120" height="70" rx="14" class="v"><animate data-ball-impact="true" attributeName="fill" values="#F3EEFF;#DBEAFE;#F3EEFF;#F3EEFF" keyTimes="0;.07;.16;1" dur="7s" begin="1.94s" repeatCount="indefinite"/></rect><text x="427" y="135" text-anchor="middle" class="label">RAG</text><text x="427" y="156" text-anchor="middle" class="small">Knowledge</text><rect x="540" y="105" width="120" height="70" rx="14" class="n"><animate data-ball-impact="true" attributeName="fill" values="#EEF2F7;#DBEAFE;#EEF2F7;#EEF2F7" keyTimes="0;.07;.16;1" dur="7s" begin="3.12s" repeatCount="indefinite"/></rect><text x="600" y="135" text-anchor="middle" class="label">Memory</text><text x="600" y="156" text-anchor="middle" class="small">State</text><rect x="713" y="105" width="120" height="70" rx="14" class="b"><animate data-ball-impact="true" attributeName="fill" values="#EAF2FF;#DBEAFE;#EAF2FF;#EAF2FF" keyTimes="0;.07;.16;1" dur="7s" begin="4.31s" repeatCount="indefinite"/></rect><text x="773" y="135" text-anchor="middle" class="label">Tools</text><text x="773" y="156" text-anchor="middle" class="small">MCP · API</text><rect x="887" y="105" width="120" height="70" rx="14" class="t"><animate data-ball-impact="true" attributeName="fill" values="#E8FBF7;#DBEAFE;#E8FBF7;#E8FBF7" keyTimes="0;.07;.16;1" dur="7s" begin="5.44s" repeatCount="indefinite"/></rect><text x="947" y="135" text-anchor="middle" class="label">Models</text><text x="947" y="156" text-anchor="middle" class="small">LLM · ML</text><rect x="1060" y="105" width="120" height="70" rx="14" class="v"><animate data-ball-impact="true" attributeName="fill" values="#F3EEFF;#DBEAFE;#F3EEFF;#F3EEFF" keyTimes="0;.07;.16;1" dur="7s" begin="6.62s" repeatCount="indefinite"/></rect><text x="1120" y="135" text-anchor="middle" class="label">Action</text><text x="1120" y="156" text-anchor="middle" class="small">Controlled</text><text x="600.0" y="225" text-anchor="middle" class="small">Grounded context + permitted tools + human oversight</text></svg>