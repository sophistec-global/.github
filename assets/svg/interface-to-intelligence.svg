<svg data-readable-timing="3x" xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">From Interface to Intelligence</title>
  <desc id="desc">Six connected technology layers spanning experience, applications, intelligence, data, cloud platform and integrations.</desc>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B5FFF"/><stop offset=".5" stop-color="#6D28D9"/><stop offset="1" stop-color="#00A99D"/></linearGradient>
    <filter id="shadow" x="-20%" y="-40%" width="140%" height="180%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0F172A" flood-opacity=".10"/></filter>
    <filter id="glow" x="-180%" y="-180%" width="460%" height="460%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#94A3B8"/></marker>
  </defs>
  <style>
    text{font-family:Inter,Segoe UI,Arial,sans-serif}.bg{fill:#F8FAFC}.eyebrow{font-size:11px;font-weight:700;letter-spacing:2px;fill:#6D28D9}.heading{font-size:22px;font-weight:750;fill:#0F172A}.sub{font-size:11px;fill:#64748B}.card{fill:#fff;stroke-width:1.7}.label{font-size:14px;font-weight:750;fill:#172033;letter-spacing:.4px}.copy{font-size:11px;fill:#64748B}.num{font-size:11px;font-weight:800;fill:#fff}.icon{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.blue{stroke:#0B5FFF}.teal{stroke:#00A99D}.violet{stroke:#6D28D9}.navy{stroke:#1D3557}.route{fill:none;stroke:#CBD5E1;stroke-width:2.5;marker-end:url(#arrow)}.rail{fill:none;stroke:url(#brand);stroke-width:4;stroke-linecap:round;opacity:.18}.motion-layer{filter:url(#glow)}
    @media(prefers-color-scheme:dark){.bg{fill:#0B1120}.heading,.label{fill:#F8FAFC}.sub,.copy{fill:#94A3B8}.card{fill:#111827}.route{stroke:#475569}}
    @media(prefers-reduced-motion:reduce){.motion-layer{display:none}}
  </style>
  <rect width="1200" height="650" rx="26" class="bg"/>
  <text x="600" y="34" text-anchor="middle" class="eyebrow">CONNECTED TECHNOLOGY STACK</text>
