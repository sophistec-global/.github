<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img"><title>Global Collaboration Footprint</title><desc>Markets and collaboration focus across Taiwan, Indonesia, Canada and the United States.</desc><style>
