<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img"><title>Request to Production</title><desc>How a request moves through a modern application stack.</desc><style>
text{font-family:Arial,sans-serif}.bg{fill:#F8FAFC}.title{font-size:22px;font-weight:700;fill:#0F172A}.label{font-size:14px;font-weight:700;fill:#1E293B}.small{font-size:11px;fill:#64748B}
.blue{fill:#EAF2FF;stroke:#0B5FFF;stroke-width:2}.teal{fill:#E8FBF7;stroke:#00A99D;stroke-width:2}.violet{fill:#F3EEFF;stroke:#6D28D9;stroke-width:2}.navy{fill:#EEF2F7;stroke:#1D3557;stroke-width:2}.panel{fill:#fff;stroke:#D8E1EE;stroke-width:1.5}
.line{stroke:#CBD5E1;stroke-width:2;fill:none}.dash{stroke:#94A3B8;stroke-width:2;fill:none;stroke-dasharray:7 7}.db{fill:#0B5FFF}.dt{fill:#00A99D}.dv{fill:#6D28D9}
@media(prefers-color-scheme:dark){.bg{fill:#0B1120}.title,.label{fill:#F8FAFC}.small{fill:#94A3B8}.blue,.teal,.violet,.navy,.panel{fill:#111827}.line,.dash{stroke:#475569}}
/* node-impact-effect */.motion-layer{filter:drop-shadow(0 0 7px #00A99D);opacity:.95}rect:not(.bg){fill-opacity:.96}@media(prefers-reduced-motion:reduce){.motion-layer{display:none}}</style><rect width="1200" height="390" rx="24" class="bg"/><text x="600" y="34" text-anchor="middle" class="title">From User Request to Production Response</text><path d="M65 150 H1085" class="line"/><g class="motion-layer" pointer-events="none"><circle r="8" class="db"><animateMotion dur="6s" repeatCount="indefinite" path="M65 150 H1085"/></circle><circle r="6" class="dt"><animateMotion dur="6s" repeatCount="indefinite" path="M1085 235 H65"/></circle></g><rect x="0" y="115" width="130" height="72" rx="15" class="teal"/><text x="65.0" y="144" text-anchor="middle" class="label">Experience</text><text x="65.0" y="165" text-anchor="middle" class="small">Web · Portal</text><rect x="170" y="115" width="130" height="72" rx="15" class="blue"/><text x="235.0" y="144" text-anchor="middle" class="label">Gateway</text><text x="235.0" y="165" text-anchor="middle" class="small">Auth · Route</text><rect x="340" y="115" width="130" height="72" rx="15" class="navy"/><text x="405.0" y="144" text-anchor="middle" class="label">Services</text><text x="405.0" y="165" text-anchor="middle" class="small">Business Logic</text><rect x="510" y="115" width="130" height="72" rx="15" class="violet"/><text x="575.0" y="144" text-anchor="middle" class="label">Intelligence</text><text x="575.0" y="165" text-anchor="middle" class="small">AI · RAG</text><rect x="680" y="115" width="130" height="72" rx="15" class="blue"/><text x="745.0" y="144" text-anchor="middle" class="label">Data</text><text x="745.0" y="165" text-anchor="middle" class="small">SQL · Cache</text><rect x="850" y="115" width="130" height="72" rx="15" class="teal"/><text x="915.0" y="144" text-anchor="middle" class="label">Integration</text><text x="915.0" y="165" text-anchor="middle" class="small">External APIs</text><rect x="1020" y="115" width="130" height="72" rx="15" class="navy"/><text x="1085.0" y="144" text-anchor="middle" class="label">Observe</text><text x="1085.0" y="165" text-anchor="middle" class="small">Logs · Metrics</text><path d="M1085 235 H65" class="dash"/><text x="600" y="290" text-anchor="middle" class="label">Request → Compute → Data / AI → Integration → Telemetry → Response</text><text x="600" y="320" text-anchor="middle" class="small">A connected system is designed around both the happy path and operational visibility.</text></svg>