eName="fill" values="#1E293B;#FFFFFF;#1E293B;#1E293B" keyTimes="0;0.0222;0.1333;0.1556;1" dur="18s" begin="0s" repeatCount="indefinite"/></text><text x="600" y="320" text-anchor="middle" class="small">A connected system is designed around both the happy path and operational visibility.<animate data-ball-text-impact="true" attributeName="fill" values="#64748B;#FFFFFF;#64748B;#64748B" keyTimes="0;0.0222;0.1333;0.1556;1" dur="18s" begin="0s" repeatCount="indefinite"/></text></svg>