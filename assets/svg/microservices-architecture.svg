<svg data-readable-timing="3x" xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
<title id="title">Microservices and Event-Driven Architecture</title><desc id="desc">Clients connect through an API Gateway or backend for frontend to identity, product, billing, notification, and integration services, then through an event broker to workers, automation, and data processing.</desc>
<defs><filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity=".09"/></filter><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#94A3B8"/></marker><linearGradient id="g" x2="1" y2="1"><stop stop-color="#0B5FFF"/><stop offset="1" stop-color="#6D28D9"/></linearGradient></defs>
<style>text{font-family:Arial,sans-serif}.bg{fill:#F8FAFC}.title{font-size:24px;font-weight:700;fill:#0F172A}.label{font-size:13px;font-weight:700;fill:#1E293B}.small{font-size:10px;fill:#64748B}.white{fill:#fff}.card{fill:#fff;stroke-width:1.7}.b{stroke:#0B5FFF}.t{stroke:#00A99D}.v{stroke:#6D28D9}.n{stroke:#1D3557}.line,.bus{fill:none;stroke:#94A3B8;stroke-width:2}.line{marker-end:url(#a)}.pulse{fill:#00A99D}@media(prefers-color-scheme:dark){.bg{fill:#0B1120}.title,.label{fill:#F8FAFC}.small{fill:#94A3B8}.card{fill:#111827}.line,.bus{stroke:#64748B}}/* node-impact-effect */.motion-layer{filter:drop-shadow(0 0 7px #00A99D);opacity:.95}rect:not(.bg){fill-opacity:.96}@media(prefers-reduced-motion:reduce){.motion-layer{display:none}}</style>
<rect width="1200" height="570" rx="24" class="bg"/><text x="600" y="38" text-anchor="middle" class="title">Microservices &amp; Event-Driven Architecture</text><text x="600" y="60" text-anchor="middle" class="small">API-first domains · asynchronous execution · observable operations</text>
